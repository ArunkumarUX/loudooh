  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  * { box-sizing: border-box; }\n  html { scroll-behavior: smooth; }\n  body { margin: 0; background: #FFFFFF; color: #14213A; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\n  a { color: #FF4A00; text-decoration: none; }\n  a:hover { color: #cc3b00; }\n  ::selection { background: #FF4A00; color: #fff; }\n  @keyframes barGrow { from { width: 0; } }\n<\u002Fstyle>\n<script src=\"bccd0b06-e04f-4e93-856e-d02277e8dfcd\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"position:relative;\">\n  <!-- reading progress -->\n  <div style=\"position:fixed;top:0;left:0;right:0;height:4px;z-index:60;background:rgba(14,30,60,0.08);\">\n    <div style=\"height:100%;background:#FF4A00;width:{{ progressPct }};transition:width .08s linear;\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- header -->\n  <header style=\"position:sticky;top:0;z-index:50;background:#0E1E3C;border-bottom:1px solid rgba(255,255,255,0.08);\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:0 24px;height:68px;display:flex;align-items:center;justify-content:space-between;gap:20px;\">\n      <a href=\"#\" style=\"display:flex;align-items:baseline;gap:0;font-family:'Inter';font-weight:900;font-size:24px;letter-spacing:-0.02em;color:#fff;\">LOUD<span style=\"color:#FF4A00;\">!<\u002Fspan><span style=\"font-weight:700;font-size:13px;letter-spacing:0.28em;margin-left:8px;align-self:center;color:#8fa0bd;\">OOH<\u002Fspan><\u002Fa>\n      <nav style=\"{{ navStyle }}\">\n        <a href=\"#\" style=\"{{ navLinkStyle }}\">Formats<\u002Fa>\n        <a href=\"#\" style=\"{{ navLinkStyle }}\">Pricing<\u002Fa>\n        <a href=\"#\" style=\"{{ navInsightStyle }}\">Insights<\u002Fa>\n        <a href=\"#\" style=\"{{ navLinkStyle }}\">About<\u002Fa>\n        <a href=\"#cta\" style=\"background:#FF4A00;color:#fff;font-family:'Inter';font-weight:800;font-size:13.5px;letter-spacing:0.03em;padding:12px 20px;text-transform:uppercase;\">Get Pricing<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- HERO -->\n  <section style=\"background:#0E1E3C;background-image:radial-gradient(120% 100% at 85% 0%, rgba(255,74,0,0.14), rgba(255,74,0,0) 55%);color:#fff;padding:56px 24px 0;\">\n    <div style=\"max-width:900px;margin:0 auto;\">\n      <div style=\"display:flex;align-items:center;gap:10px;font-size:13px;color:#8fa0bd;font-weight:600;margin-bottom:28px;\">\n        <a href=\"#\" style=\"color:#8fa0bd;\">Insights<\u002Fa><span style=\"opacity:.5;\">/<\u002Fspan><span style=\"color:#cdd6e6;\">Rail Advertising<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:inline-flex;align-items:center;gap:8px;background:#FF4A00;color:#fff;font-family:'Inter';font-weight:800;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;padding:7px 12px;margin-bottom:22px;\">Buyer's Guide<\u002Fdiv>\n      <h1 style=\"font-family:'Inter';font-weight:900;font-size:clamp(34px,6vw,60px);line-height:1.02;letter-spacing:-0.02em;margin:0 0 22px;text-transform:uppercase;\">Rail Advertising in the UK<\u002Fh1>\n      <p style=\"font-size:clamp(18px,2.4vw,23px);line-height:1.5;color:#c3cede;font-weight:400;max-width:720px;margin:0 0 34px;\">A real guide to what it costs, what works, and whether it's right for your business. No forms, no vague ranges — just the numbers you need to decide.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px;padding-bottom:40px;border-bottom:1px solid rgba(255,255,255,0.1);\">\n        <div style=\"display:flex;align-items:center;gap:11px;\">\n          <div style=\"width:40px;height:40px;background:#FF4A00;display:flex;align-items:center;justify-content:center;font-family:'Inter';font-weight:900;font-size:15px;\">L!<\u002Fdiv>\n          <div style=\"line-height:1.25;\"><div style=\"font-weight:700;font-size:14.5px;color:#fff;\">Loud! OOH<\u002Fdiv><div style=\"font-size:12.5px;color:#8fa0bd;\">OOH planning &amp; buying<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width:1px;height:32px;background:rgba(255,255,255,0.12);\"><\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#c3cede;\"><span style=\"color:#8fa0bd;\">Updated<\u002Fspan> July 2026<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#c3cede;\"><span style=\"color:#8fa0bd;\">Read<\u002Fspan> 20 min<\u002Fdiv>\n        <div style=\"flex:1;\"><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;\">\n          <span style=\"font-size:12.5px;color:#8fa0bd;font-weight:600;\">Share<\u002Fspan>\n          <sc-for list=\"{{ shares }}\" as=\"s\" hint-placeholder-count=\"3\"><a href=\"#\" style=\"width:36px;height:36px;border:1px solid rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;color:#cdd6e6;font-weight:700;font-size:13px;font-family:'Inter';\">{{ s }}<\u002Fa><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1080px;margin:44px auto 0;\">\n      <div style=\"position:relative;width:100%;aspect-ratio:16/7;border:3px solid #FF4A00;\">\n        <image-slot id=\"rail-hero\" shape=\"rect\" fit=\"cover\" placeholder=\"Drop a real UK station OOH photo (concourse digital screen / platform 6-sheet)\"><\u002Fimage-slot>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:#8fa0bd;margin-top:10px;font-family:'Inter';\">A large-format digital screen on a London terminus concourse — the premium rail format.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:56px;\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- BODY: TOC + article -->\n  <div style=\"{{ bodyGridStyle }}\">\n    <!-- TOC -->\n    <aside style=\"{{ tocStyle }}\">\n      <div style=\"font-family:'Inter';font-weight:800;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#8b96a9;margin-bottom:16px;\">On this page<\u002Fdiv>\n      <nav style=\"display:flex;flex-direction:column;border-left:2px solid #E6E9F0;\">\n        <sc-for list=\"{{ toc }}\" as=\"t\" hint-placeholder-count=\"8\">\n          <a href=\"#\" onclick=\"{{ t.onClick }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fnav>\n    <\u002Faside>\n\n    <!-- ARTICLE -->\n    <article style=\"max-width:720px;font-size:17.5px;line-height:1.72;color:#2c3a55;\">\n      <div style=\"color:#2c3a55;\">\n        <p style=\"font-size:20px;line-height:1.62;color:#14213A;margin:0 0 22px;font-weight:500;\">Rail advertising guides tend to be written by people who have never bought any. They tell you the network carries over a billion journeys a year, that commuters are attractive, that stations are high-impact — all true, none of it useful — then comes the contact form, because the actual prices are apparently a secret.<\u002Fp>\n        <p style=\"margin:0 0 22px;\">We plan and buy rail campaigns across the UK network, from single-station regional activity to multi-station London terminus takeovers. This guide covers the UK national rail market: railway stations and trains across the National Rail network. It includes every format, real 2026 pricing from the Loud! OOH rate card, how to choose between stations, and an honest answer to the question that matters — is this right for my business, and what will it genuinely cost?<\u002Fp>\n      <\u002Fdiv>\n      <!-- NUMBERS -->\n      <h2 id=\"numbers\" style=\"scroll-margin-top:88px;font-family:'Inter';font-weight:900;font-size:clamp(25px,3.6vw,34px);line-height:1.1;letter-spacing:-0.02em;color:#0E1E3C;text-transform:uppercase;margin:52px 0 20px;padding-left:18px;border-left:5px solid #FF4A00;\">First, the numbers that matter<\u002Fh2>\n      <p style=\"margin:0 0 26px;\">The UK national rail network handled approximately <strong>1.7 billion passenger journeys<\u002Fstrong> in the year to March 2025 (Office of Rail and Road). Traffic is heavily concentrated: the London termini alone account for hundreds of millions of annual entries and exits, with Liverpool Street the busiest station in Britain at over 80 million.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:#E6E9F0;border:1px solid #E6E9F0;margin:0 0 30px;\">\n        <sc-for list=\"{{ stats }}\" as=\"st\" hint-placeholder-count=\"6\">\n          <div style=\"background:#fff;padding:22px 20px;\">\n            <div style=\"font-family:'Inter';font-weight:900;font-size:30px;letter-spacing:-0.02em;color:#FF4A00;line-height:1;\">{{ st.v }}<\u002Fdiv>\n            <div style=\"font-weight:700;font-size:14px;color:#0E1E3C;margin:9px 0 3px;line-height:1.3;\">{{ st.l }}<\u002Fdiv>\n            <div style=\"font-size:12px;color:#8b96a9;\">{{ st.s }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <p style=\"margin:0 0 22px;\">Two characteristics make rail genuinely distinctive. The first is <strong>dwell time<\u002Fstrong> — the average passenger spends around 12 minutes in the station per journey, considerably longer when trains are delayed. People waiting for a platform announcement stand still, facing the departure boards, in exactly the sightline where the best inventory sits.<\u002Fp>\n      <p style=\"margin:0 0 12px;\">The second is <strong>frequency<\u002Fstrong>. A season-ticket holder passes through the same station ten times a week — roughly 450 times a year. A well-placed campaign doesn’t reach them once; it reaches them every working day for the entire period. Rail commuters also skew ABC1, with a strong concentration of professionals and above-average incomes.<\u002Fp>\n\n      <!-- AUDIENCE -->\n      <h2 id=\"audience\" style=\"scroll-margin-top:88px;font-family:'Inter';font-weight:900;font-size:clamp(25px,3.6vw,34px);line-height:1.1;letter-spacing:-0.02em;color:#0E1E3C;text-transform:uppercase;margin:56px 0 10px;padding-left:18px;border-left:5px solid #FF4A00;\">Who actually uses UK rail stations?<\u002Fh2>\n      <p style=\"margin:0 0 26px;\">A station is not one audience. It is a commuter audience in the morning peak, a business audience through the day, and a leisure audience at weekends. The best campaigns are planned against the specific segment that matters — not the headline footfall number.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:14px;margin:0 0 8px;\">\n        <sc-for list=\"{{ audiences }}\" as=\"a\" hint-placeholder-count=\"3\">\n          <div style=\"border:1px solid #E6E9F0;border-top:3px solid #0E1E3C;padding:22px 24px;\">\n            <div style=\"font-family:'Inter';font-weight:800;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#FF4A00;margin-bottom:5px;\">{{ a.tag }}<\u002Fdiv>\n            <div style=\"font-family:'Inter';font-weight:800;font-size:21px;color:#0E1E3C;margin-bottom:10px;\">{{ a.k }}<\u002Fdiv>\n            <div style=\"font-size:16px;line-height:1.62;color:#3a4761;\">{{ a.d }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- FORMATS -->\n      <h2 id=\"formats\" style=\"scroll-margin-top:88px;font-family:'Inter';font-weight:900;font-size:clamp(25px,3.6vw,34px);line-height:1.1;letter-spacing:-0.02em;color:#0E1E3C;text-transform:uppercase;margin:56px 0 10px;padding-left:18px;border-left:5px solid #FF4A00;\">Every format explained<\u002Fh2>\n      <p style=\"margin:0 0 12px;\">All prices are media costs for a standard two-week campaign unless stated, excluding VAT and print production. Pricing splits between London termini and major regional stations; smaller local stations price below the regional figures shown.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin:26px 0 8px;\">\n        <sc-for list=\"{{ formats }}\" as=\"f\" hint-placeholder-count=\"8\">\n          <div style=\"border:1px solid #E6E9F0;background:#fff;display:flex;flex-direction:column;\">\n            <div style=\"padding:20px 22px 16px;border-bottom:1px solid #F0F2F6;\">\n              <div style=\"display:inline-block;font-family:'Inter';font-weight:800;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:#68758c;border:1px solid #dfe3ec;padding:4px 9px;margin-bottom:12px;\">{{ f.tag }}<\u002Fdiv>\n              <div style=\"font-family:'Inter';font-weight:800;font-size:19px;color:#0E1E3C;line-height:1.15;margin-bottom:10px;\">{{ f.name }}<\u002Fdiv>\n              <div style=\"font-size:14.5px;line-height:1.55;color:#4a5872;\">{{ f.d }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:14px 22px;display:flex;flex-direction:column;gap:8px;\">\n              <sc-for list=\"{{ f.prices }}\" as=\"p\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13.5px;\">\n                  <span style=\"color:#8b96a9;\">{{ p.k }}<\u002Fspan>\n                  <span style=\"font-family:'Inter';font-weight:700;color:#0E1E3C;text-align:right;\">{{ p.v }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:auto;padding:13px 22px;background:#0E1E3C;color:#c3cede;font-size:12.5px;line-height:1.45;\"><span style=\"color:#FF4A00;font-weight:700;font-family:'Inter';text-transform:uppercase;letter-spacing:0.05em;font-size:11px;\">Best for<\u002Fspan><br>{{ f.best }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- RATE CARD -->\n      <h2 id=\"ratecard\" style=\"scroll-margin-top:88px;font-family:'Inter';font-weight:900;font-size:clamp(25px,3.6vw,34px);line-height:1.1;letter-spacing:-0.02em;color:#0E1E3C;text-transform:uppercase;margin:56px 0 10px;padding-left:18px;border-left:5px solid #FF4A00;\">The 2026 rate card<\u002Fh2>\n      <p style=\"margin:0 0 22px;\">Media cost only, excluding VAT and production. Two-week trading period unless stated. We publish these openly and do not mark up media costs.<\u002Fp>\n      <div style=\"overflow-x:auto;border:1px solid #E6E9F0;margin:0 0 14px;\">\n        <sc-for list=\"{{ rateRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n              <\u002Fsc-for><table style=\"width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px;\">\n          <thead>\n            <tr style=\"background:#0E1E3C;color:#fff;text-align:left;font-family:'Inter';\">\n              <th style=\"padding:12px 16px;font-weight:700;font-size:12px;letter-spacing:0.04em;\">Format<\u002Fth>\n              <th style=\"padding:12px 12px;font-weight:700;font-size:12px;\">Regional<\u002Fth>\n              <th style=\"padding:12px 12px;font-weight:700;font-size:12px;\">Major regional<\u002Fth>\n              <th style=\"padding:12px 12px;font-weight:700;font-size:12px;\">London termini<\u002Fth>\n              <th style=\"padding:12px 16px;font-weight:700;font-size:12px;\">Notes<\u002Fth>\n            <\u002Ftr>\n          <\u002Fthead>\n          <tbody>\n            <tr style=\"border-top:1px solid #EEF0F5;\">\n                <td style=\"padding:12px 16px;font-weight:700;color:#0E1E3C;\">{{ r.fmt }}<\u002Ftd>\n                <td style=\"padding:12px 12px;color:#3a4761;\">{{ r.reg }}<\u002Ftd>\n                <td style=\"padding:12px 12px;color:#3a4761;\">{{ r.maj }}<\u002Ftd>\n                <td style=\"padding:12px 12px;font-weight:700;color:#FF4A00;\">{{ r.lon }}<\u002Ftd>\n                <td style=\"padding:12px 16px;color:#8b96a9;font-size:12.5px;\">{{ r.note }}<\u002Ftd>\n              <\u002Ftr>\n            \n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:#8b96a9;margin-bottom:8px;\">Source: Loud! OOH 2026 Rate Card.<\u002Fdiv>\n\n      <!-- BUDGETS -->\n      <h2 id=\"budgets\" style=\"scroll-margin-top:88px;font-family:'Inter';font-weight:900;font-size:clamp(25px,3.6vw,34px);line-height:1.1;letter-spacing:-0.02em;color:#0E1E3C;text-transform:uppercase;margin:56px 0 10px;padding-left:18px;border-left:5px solid #FF4A00;\">What a campaign looks like by budget<\u002Fh2>\n      <p style=\"margin:0 0 24px;\">Individual panel prices only tell you so much. Here is what rail advertising actually looks like across total budgets.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:14px;\">\n        <sc-for list=\"{{ budgets }}\" as=\"b\" hint-placeholder-count=\"4\">\n          <div style=\"display:grid;grid-template-columns:130px 1fr;gap:20px;align-items:start;border:1px solid #E6E9F0;padding:20px 22px;\">\n            <div style=\"font-family:'Inter';font-weight:900;font-size:20px;color:#FF4A00;letter-spacing:-0.01em;line-height:1.1;\">{{ b.r }}<\u002Fdiv>\n            <div><div style=\"font-family:'Inter';font-weight:800;font-size:17px;color:#0E1E3C;margin-bottom:6px;\">{{ b.h }}<\u002Fdiv><div style=\"font-size:15px;line-height:1.6;color:#4a5872;\">{{ b.d }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- FACTORS -->\n      <h2 id=\"factors\" style=\"scroll-margin-top:88px;font-family:'Inter';font-weight:900;font-size:clamp(25px,3.6vw,34px);line-height:1.1;letter-spacing:-0.02em;color:#0E1E3C;text-transform:uppercase;margin:56px 0 10px;padding-left:18px;border-left:5px solid #FF4A00;\">The factors that move the price<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;margin-top:12px;\">\n        <sc-for list=\"{{ factors }}\" as=\"fa\" hint-placeholder-count=\"5\">\n          <div style=\"padding:18px 0;border-bottom:1px solid #EEF0F5;\">\n            <div style=\"font-family:'Inter';font-weight:800;font-size:17px;color:#0E1E3C;margin-bottom:5px;\">{{ fa.h }}<\u002Fdiv>\n            <div style=\"font-size:15.5px;line-height:1.6;color:#4a5872;\">{{ fa.d }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- EFFECTIVENESS -->\n      <h2 id=\"effectiveness\" style=\"scroll-margin-top:88px;font-family:'Inter';font-weight:900;font-size:clamp(25px,3.6vw,34px);line-height:1.1;letter-spacing:-0.02em;color:#0E1E3C;text-transform:uppercase;margin:56px 0 20px;padding-left:18px;border-left:5px solid #FF4A00;\">Does it work? The honest answer.<\u002Fh2>\n      <p style=\"margin:0 0 22px;\">Rail’s defining strength is repetition. A commuter passes your platform panel ten times a week — over a four-week campaign, forty exposures to the same message with 12 minutes of average dwell each. No other UK outdoor environment builds frequency with a defined, affluent audience this efficiently.<\u002Fp>\n      <blockquote style=\"margin:28px 0;padding:22px 26px;background:#0E1E3C;color:#fff;border-left:5px solid #FF4A00;\">\n        <div style=\"font-family:'Inter';font-weight:700;font-size:20px;line-height:1.4;\">Rail advertising is the most efficient frequency-building format in UK outdoor for reaching commuters and city-centre audiences.<\u002Fdiv>\n      <\u002Fblockquote>\n      <p style=\"margin:0 0 20px;\"><strong style=\"color:#0E1E3C;\">Where it’s strongest.<\u002Fstrong> Recruitment performs exceptionally — you’re addressing people during their commute to a job they may want to leave. Financial, professional and B2B brands benefit from the ABC1 concentration. And traincards, with 30–45 minutes of dwell, genuinely support direct response.<\u002Fp>\n      <p style=\"margin:0 0 12px;\"><strong style=\"color:#0E1E3C;\">What it doesn’t do well.<\u002Fstrong> Rail reaches rail users, and rail users are not everyone. If your audience drives, works from home, or lives outside commuter catchments, station advertising will miss them. It’s also weaker for cheap national reach — roadside delivers raw national coverage more cheaply. Note too that Mon and Fri commuter volumes remain measurably quieter post-pandemic; midweek-weighted digital reaches the modern pattern more efficiently.<\u002Fp>\n\n      <!-- STATIONS -->\n      <h2 id=\"stations\" style=\"scroll-margin-top:88px;font-family:'Inter';font-weight:900;font-size:clamp(25px,3.6vw,34px);line-height:1.1;letter-spacing:-0.02em;color:#0E1E3C;text-transform:uppercase;margin:56px 0 10px;padding-left:18px;border-left:5px solid #FF4A00;\">Choosing the right stations<\u002Fh2>\n      <p style=\"margin:0 0 26px;\">Match the terminus to the industry and demographic you want, not just the biggest footfall number. Annual usage across the ten busiest managed stations:<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:11px;margin:0 0 30px;\">\n        <sc-for list=\"{{ stationRows }}\" as=\"s\" hint-placeholder-count=\"10\">\n          <div style=\"display:flex;align-items:center;gap:14px;\">\n            <div style=\"width:150px;flex:none;font-size:13.5px;font-weight:600;color:#0E1E3C;text-align:right;line-height:1.2;\">{{ s.name }}<\u002Fdiv>\n            <div style=\"flex:1;height:26px;background:#F0F2F6;position:relative;\">\n              <div style=\"height:100%;width:{{ s.pct }};background:#0E1E3C;animation:barGrow .9s ease-out;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"width:52px;flex:none;font-family:'Inter';font-weight:800;font-size:13.5px;color:#FF4A00;\">{{ s.usage }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"overflow-x:auto;border:1px solid #E6E9F0;margin:0 0 14px;\">\n        <sc-for list=\"{{ stationRows }}\" as=\"s\" hint-placeholder-count=\"10\">\n              <\u002Fsc-for><table style=\"width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px;\">\n          <thead>\n            <tr style=\"background:#0E1E3C;color:#fff;text-align:left;font-family:'Inter';\">\n              <th style=\"padding:12px 16px;font-weight:700;font-size:12px;\">Station<\u002Fth>\n              <th style=\"padding:12px 12px;font-weight:700;font-size:12px;\">Usage<\u002Fth>\n              <th style=\"padding:12px 12px;font-weight:700;font-size:12px;\">Primary audience<\u002Fth>\n              <th style=\"padding:12px 16px;font-weight:700;font-size:12px;\">Best for<\u002Fth>\n            <\u002Ftr>\n          <\u002Fthead>\n          <tbody>\n            <tr style=\"border-top:1px solid #EEF0F5;\">\n                <td style=\"padding:11px 16px;font-weight:700;color:#0E1E3C;\">{{ s.name }}<\u002Ftd>\n                <td style=\"padding:11px 12px;font-weight:700;color:#FF4A00;\">{{ s.usage }}<\u002Ftd>\n                <td style=\"padding:11px 12px;color:#3a4761;\">{{ s.aud }}<\u002Ftd>\n                <td style=\"padding:11px 16px;color:#3a4761;\">{{ s.best }}<\u002Ftd>\n              <\u002Ftr>\n            \n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:#8b96a9;margin-bottom:8px;\">Source: Office of Rail and Road station usage estimates, 2024-25.<\u002Fdiv>\n\n      <!-- BOOKING -->\n      <h2 id=\"booking\" style=\"scroll-margin-top:88px;font-family:'Inter';font-weight:900;font-size:clamp(25px,3.6vw,34px);line-height:1.1;letter-spacing:-0.02em;color:#0E1E3C;text-transform:uppercase;margin:56px 0 20px;padding-left:18px;border-left:5px solid #FF4A00;\">The booking process<\u002Fh2>\n      <p style=\"margin:0 0 22px;\">Allow three to five weeks from brief to live for standard poster and D6 campaigns. Printed formats need artwork sign-off then print and posting (one to two weeks); digital can move faster once artwork is approved. Station dominations and train wraps need eight to twelve weeks minimum, and premium concourse screens at the London termini book ahead — particularly for autumn and new year.<\u002Fp>\n      <p style=\"margin:0 0 22px;\">Inventory is managed by a small number of media owners holding long-term concessions with Network Rail and the train operating companies. A multi-station campaign often involves multiple owners — booking through an agency consolidates that into one plan, one point of accountability, and better rates than individual direct bookings.<\u002Fp>\n      <div style=\"border-left:4px solid #FF4A00;background:#FFF4EF;padding:16px 20px;font-size:14.5px;line-height:1.6;color:#3a4761;margin:0 0 8px;\"><strong style=\"color:#0E1E3C;\">Compliance:<\u002Fstrong> all creative must comply with the CAP Code, and rail environments carry additional restrictions — notably around imagery that could be distressing in a rail context or mistaken for operational signage. Submit artwork for approval at least five working days before your start date.<\u002Fdiv>\n\n      <!-- SME -->\n      <h2 id=\"sme\" style=\"scroll-margin-top:88px;font-family:'Inter';font-weight:900;font-size:clamp(25px,3.6vw,34px);line-height:1.1;letter-spacing:-0.02em;color:#0E1E3C;text-transform:uppercase;margin:56px 0 20px;padding-left:18px;border-left:5px solid #FF4A00;\">Is rail right for an SME?<\u002Fh2>\n      <p style=\"margin:0 0 24px;\">Straight answer: rail is one of the most SME-accessible premium formats in UK outdoor, provided you buy at the right level. Local and regional station advertising is genuinely affordable, and the frequency it builds against a defined catchment is something small businesses usually can’t buy anywhere else at the price.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:0 0 8px;\">\n        <div style=\"border:1px solid #E6E9F0;border-top:3px solid #1F8A5B;padding:20px 22px;\">\n          <div style=\"font-family:'Inter';font-weight:800;font-size:15px;color:#1F8A5B;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:14px;\">When it makes sense<\u002Fdiv>\n          <ul style=\"margin:0;padding-left:18px;font-size:14.5px;line-height:1.7;color:#3a4761;\">\n            <li>Your customers cluster in a town, city or commuter catchment<\u002Fli>\n            <li>You want repeated exposure over one-off reach<\u002Fli>\n            <li>You’re recruiting and want employed professionals mid-commute<\u002Fli>\n            <li>Your local station has meaningful footfall and panels start in the hundreds<\u002Fli>\n            <li>You can run four weeks or more to let frequency build<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E6E9F0;border-top:3px solid #C43D2E;padding:20px 22px;\">\n          <div style=\"font-family:'Inter';font-weight:800;font-size:15px;color:#C43D2E;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:14px;\">When to think twice<\u002Fdiv>\n          <ul style=\"margin:0;padding-left:18px;font-size:14.5px;line-height:1.7;color:#3a4761;\">\n            <li>Your audience predominantly drives or works from home<\u002Fli>\n            <li>You need broad national reach on a limited budget<\u002Fli>\n            <li>You need immediate, trackable response as the primary metric<\u002Fli>\n            <li>Your timeline is shorter than three to four weeks<\u002Fli>\n            <li>Your catchment doesn’t align with any station’s commuter flow<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- FAQ -->\n      <h2 id=\"faq\" style=\"scroll-margin-top:88px;font-family:'Inter';font-weight:900;font-size:clamp(25px,3.6vw,34px);line-height:1.1;letter-spacing:-0.02em;color:#0E1E3C;text-transform:uppercase;margin:56px 0 20px;padding-left:18px;border-left:5px solid #FF4A00;\">Frequently asked questions<\u002Fh2>\n      <div style=\"border-top:1px solid #E6E9F0;margin:0 0 8px;\">\n        <sc-for list=\"{{ faqs }}\" as=\"q\" hint-placeholder-count=\"6\">\n          <div style=\"border-bottom:1px solid #E6E9F0;\">\n            <button onclick=\"{{ q.onClick }}\" style=\"width:100%;text-align:left;background:none;border:none;padding:18px 40px 18px 0;cursor:pointer;font-family:'Inter';font-weight:700;font-size:16.5px;color:#0E1E3C;position:relative;line-height:1.35;\">{{ q.q }}<span style=\"position:absolute;right:4px;top:50%;transform:translateY(-50%);color:#FF4A00;font-size:22px;font-weight:400;\">{{ q.sign }}<\u002Fspan><\u002Fbutton>\n            <sc-if value=\"{{ q.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:0 30px 22px 0;font-size:15.5px;line-height:1.68;color:#4a5872;\">{{ q.a }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- CLOSING -->\n      <h2 style=\"font-family:'Inter';font-weight:900;font-size:clamp(25px,3.6vw,34px);line-height:1.1;letter-spacing:-0.02em;color:#0E1E3C;text-transform:uppercase;margin:56px 0 20px;padding-left:18px;border-left:5px solid #FF4A00;\">Final thoughts<\u002Fh2>\n      <p style=\"margin:0 0 22px;\">Rail advertising is the frequency format of UK outdoor. Nothing else puts your message in front of the same defined, affluent audience ten times a week with twelve minutes of dwell per exposure. At the local and regional level it is also one of the most underpriced formats in the market, because national money crowds into the London termini and leaves the rest of the network genuinely good value.<\u002Fp>\n      <p style=\"margin:0 0 8px;\">Whether rail is right for your business comes down to one question: <strong style=\"color:#0E1E3C;\">does your audience pass through a station regularly?<\u002Fstrong> If they do, rail advertising will reach them more often, for longer, than almost anything else you can buy.<\u002Fp>\n      <!--MORE-->\n    <\u002Farticle>\n  <\u002Fdiv>\n\n  <!-- CTA -->\n  <section id=\"cta\" style=\"background:#0E1E3C;background-image:radial-gradient(100% 120% at 15% 100%, rgba(255,74,0,0.16), rgba(255,74,0,0) 55%);color:#fff;margin-top:72px;padding:64px 24px;\">\n    <div style=\"max-width:820px;margin:0 auto;text-align:center;\">\n      <div style=\"font-family:'Inter';font-weight:800;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#FF4A00;margin-bottom:18px;\">Plan your campaign<\u002Fdiv>\n      <h2 style=\"font-family:'Inter';font-weight:900;font-size:clamp(28px,4.5vw,44px);line-height:1.04;letter-spacing:-0.02em;text-transform:uppercase;margin:0 0 18px;\">See exactly what your rail campaign will cost<\u002Fh2>\n      <p style=\"font-size:18px;line-height:1.55;color:#c3cede;max-width:560px;margin:0 auto 32px;\">We plan and buy rail advertising for SMEs and challenger brands across the UK. Open pricing, no media mark-up — you know what you’re committing to before you commit to anything.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:14px;justify-content:center;\">\n        <a href=\"#\" style=\"background:#FF4A00;color:#fff;font-family:'Inter';font-weight:800;font-size:15px;letter-spacing:0.03em;text-transform:uppercase;padding:16px 30px;\">See the full rate card<\u002Fa>\n        <a href=\"#\" style=\"border:1px solid rgba(255,255,255,0.35);color:#fff;font-family:'Inter';font-weight:800;font-size:15px;letter-spacing:0.03em;text-transform:uppercase;padding:16px 30px;\">Talk to a planner<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"margin-top:26px;font-size:14px;color:#8fa0bd;\">hello@loudooh.co.uk &nbsp;·&nbsp; 020 4514 9147 &nbsp;·&nbsp; loudooh.co.uk/pricing<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- RELATED -->\n  <section style=\"max-width:1240px;margin:0 auto;padding:64px 24px 8px;\">\n    <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:24px;\">\n      <h2 style=\"font-family:'Inter';font-weight:900;font-size:clamp(22px,3vw,30px);letter-spacing:-0.02em;text-transform:uppercase;color:#0E1E3C;margin:0;padding-left:16px;border-left:5px solid #FF4A00;line-height:1.1;\">Keep reading<\u002Fh2>\n      <a href=\"#\" style=\"font-family:'Inter';font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap;\">All insights →<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;\">\n      <sc-for list=\"{{ related }}\" as=\"r\" hint-placeholder-count=\"3\">\n        <a href=\"#\" style=\"display:flex;flex-direction:column;border:1px solid #E6E9F0;background:#fff;color:inherit;transition:border-color .15s;\" style-hover=\"border-color:#FF4A00;\">\n          <div style=\"height:120px;background:#0E1E3C;position:relative;overflow:hidden;\">\n            <div style=\"position:absolute;inset:0;background-image:repeating-linear-gradient(135deg,rgba(255,74,0,0.16) 0 12px,transparent 12px 24px);\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:20px 22px;\">\n            <div style=\"font-family:'Inter';font-weight:800;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:#FF4A00;margin-bottom:10px;\">{{ r.tag }}<\u002Fdiv>\n            <div style=\"font-family:'Inter';font-weight:800;font-size:18px;line-height:1.22;color:#0E1E3C;margin-bottom:14px;\">{{ r.title }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#8b96a9;\">{{ r.read }} read<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"background:#0A1730;color:#8fa0bd;margin-top:64px;padding:44px 24px;\">\n    <div style=\"max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;\">\n      <div style=\"display:flex;align-items:baseline;font-family:'Inter';font-weight:900;font-size:22px;letter-spacing:-0.02em;color:#fff;\">LOUD<span style=\"color:#FF4A00;\">!<\u002Fspan><span style=\"font-weight:700;font-size:12px;letter-spacing:0.28em;margin-left:8px;align-self:center;color:#8fa0bd;\">OOH<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:13px;\">© 2026 Loud! OOH &nbsp;·&nbsp; UK out-of-home planning &amp; buying &nbsp;·&nbsp; Bigger. Bolder. Louder.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <!-- back to top -->\n  <button onclick=\"{{ scrollTop }}\" aria-label=\"Back to top\" style=\"{{ topBtnStyle }}\">↑<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = { progress: 0, active: 'numbers', openFaq: 0, showTop: false, narrow: false };\n\n  componentDidMount() {\n    this._onResize = () => {\n      const w = window.innerWidth;\n      const narrow = w < 920;\n      if (narrow !== this.state.narrow) this.setState({ narrow });\n    };\n    window.addEventListener('resize', this._onResize, { passive: true });\n    this._onResize();\n    this._sections = ['numbers','audience','formats','ratecard','budgets','factors','effectiveness','stations','booking','sme','faq'];\n    this._onScroll = () => {\n      const h = document.documentElement;\n      const max = h.scrollHeight - h.clientHeight;\n      const p = max > 0 ? Math.min(100, (h.scrollTop / max) * 100) : 0;\n      let active = this.state.active;\n      const line = 140;\n      for (const id of this._sections) {\n        const el = document.getElementById(id);\n        if (el && el.getBoundingClientRect().top - line <= 0) active = id;\n      }\n      const showTop = h.scrollTop > 900;\n      if (p !== this.state.progress || active !== this.state.active || showTop !== this.state.showTop) this.setState({ progress: p, active, showTop });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n  }\n  componentWillUnmount() { window.removeEventListener('scroll', this._onScroll); window.removeEventListener('resize', this._onResize); }\n\n  go(id) {\n    return (e) => {\n      e.preventDefault();\n      const el = document.getElementById(id);\n      if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 88, behavior: 'smooth' });\n    };\n  }\n  toggleFaq(i) { return () => this.setState(s => ({ openFaq: s.openFaq === i ? -1 : i })); }\n\n  renderVals() {\n    const tocItems = [\n      ['numbers','The numbers that matter'],\n      ['audience','Who uses UK rail?'],\n      ['formats','Every format explained'],\n      ['ratecard','The 2026 rate card'],\n      ['budgets','Campaigns by budget'],\n      ['factors','What moves the price'],\n      ['effectiveness','Does it actually work?'],\n      ['stations','Choosing the right stations'],\n      ['booking','The booking process'],\n      ['sme','Right for an SME?'],\n      ['faq','FAQs'],\n    ];\n    const toc = tocItems.map(([id,label]) => {\n      const on = this.state.active === id;\n      return { label, onClick: this.go(id), style:\n        'padding:8px 0 8px 16px;margin-left:-2px;font-size:14px;line-height:1.35;font-weight:'+(on?'700':'500')+';'\n        + 'border-left:2px solid '+(on?'#FF4A00':'transparent')+';color:'+(on?'#0E1E3C':'#68758c')+';cursor:pointer;transition:color .15s;' };\n    });\n\n    const stats = [\n      { v:'1.7bn', l:'UK rail journeys a year', s:'ORR, year to Mar 2025' },\n      { v:'80.4m', l:'Busiest station: Liverpool St', s:'entries & exits, 2024-25' },\n      { v:'~12 min', l:'Average station dwell', s:'per journey, longer if delayed' },\n      { v:'~450', l:'Journeys a year, 5-day commuter', s:'the frequency engine' },\n      { v:'55–70%', l:'Prompted ad recall', s:'among regular station users' },\n      { v:'60–70%', l:'Rail commuters who are ABC1', s:'multiple industry sources' },\n    ];\n\n    const audiences = [\n      { k:'Commuters', tag:'The frequency audience', d:'Travel the same stations at the same times every working day, so a campaign builds frequency automatically. Disproportionately professional and ABC1, concentrated on routes into London and major business centres. Peak 7–9:30am and 4:30–7pm on weekdays.' },\n      { k:'Business travellers', tag:'The intercity audience', d:'Professionals travelling to meetings and client visits, concentrated at the major termini and on primary intercity corridors. Longer dwell than commuters — a Euston–Manchester traveller typically spends 20–30 minutes in the station before departure.' },\n      { k:'Leisure travellers', tag:'The weekend audience', d:'Weekends and holidays shift stations towards families, day-trippers, event-goers and tourists. This audience dwells longer, moves slower and engages more with retail and food. A genuinely different audience from the weekday commuter flow.' },\n    ];\n\n    const formats = [\n      { name:'6-Sheet Posters', tag:'Print', d:'The workhorse format. Backlit panels on platforms, in ticket halls and at entrances — passengers waiting for a train are directly in front of them with nothing else demanding attention. Present at 1,000+ UK stations.', prices:[['Regional','£300 / panel'],['Major regional','£500 / panel'],['London termini','£1,200 / panel']], best:'Frequency campaigns against commuters; local business targeting.' },\n      { name:'Digital 6-Sheets (D6)', tag:'Digital', d:'The digital equivalent on station screen networks. Ads rotate on a timed loop with daypart targeting, no print cost, and creative changeable remotely mid-campaign. The fastest-growing segment of rail inventory.', prices:[['Regional','£400 / screen'],['Major regional','£550 / screen'],['London termini','£2,200 / screen']], best:'Targeting specific commuter windows; brands needing creative flexibility.' },\n      { name:'48 & 96-Sheet Billboards', tag:'Print', d:'Large format on station approaches, alongside tracks at platform ends, and on exterior walls. Trackside 48-sheets are seen from arriving and departing trains too, adding an on-train audience. Often surprisingly good value regionally.', prices:[['Regional','£1,200'],['Major regional','£2,000'],['London termini','£4,500']], best:'Brand awareness at scale; creative that benefits from a large canvas.' },\n      { name:'Large Format Digital', tag:'Digital', d:'The premium station format. Full-motion screens above concourses, facing departure boards. When 500 people are staring at the boards, the screen beside them has their attention by default — among the most valuable OOH sites in the country.', prices:[['Major regional','£2,500'],['London termini','£9,000'],['','premium concourse']], best:'High-impact brand campaigns, launches, motion-led creative.' },\n      { name:'Concourse & Experiential', tag:'Experiential', d:'Floor-standing sites on main concourses for product displays, sampling and pop-ups. The larger termini have designated experiential zones with power and footfall in the tens of thousands daily. Puts your brand in the path of the audience.', prices:[['Major regional','£1,800 / week'],['London termini','£7,000 / week'],['','+ staffing & build']], best:'Product sampling, launches, brands that benefit from interaction.' },\n      { name:'Station Takeovers', tag:'Domination', d:'Complete brand presence across a station: every panel, every screen, often wraps on barriers, floors and architecture. Takeovers at the major London termini generate press and social coverage in their own right.', prices:[['Regional','£15,000'],['Major regional','£35,000'],['London termini','£75,000+']], best:'Major launches and brand moments; saturating a catchment.' },\n      { name:'Traincards (interior)', tag:'Print', d:'Printed panels inside carriages, above windows and seats. Commuters sit facing them for a 30–45 minute journey, so traincards support longer copy and direct-response mechanics like QR codes. Sold in fleet packages.', prices:[['Per panel','from £18 / 2wks'],['Typical','500–2,000 panels'],['1,000-panel','from £18,000']], best:'Detailed messaging, recruitment, financial services, direct response.' },\n      { name:'Train Exterior Wraps', tag:'Domination', d:'Full or partial branding on the outside of trains — the train becomes a moving campaign across its whole route, seen at every station it calls at and every platform it passes. High production cost, priced on application.', prices:[['Per train','from £25,000'],['','+ significant production'],['Lead time','12+ weeks']], best:'Major brand campaigns, tourism bodies, route-level partnerships.' },\n    ];\n\n    const rateCard = [\n      ['6-sheet poster','£300 / panel','£500 / panel','£1,200 / panel','Widest availability, 1,000+ stations'],\n      ['Digital 6-sheet (D6)','£400 / screen','£550 / screen','£2,200 / screen','Daypart targeting available'],\n      ['48-sheet billboard','£1,200','£2,000','£4,500','Includes trackside sites'],\n      ['Large format digital','£1,800','£2,500','£9,000','Premium concourse positions'],\n      ['Concourse experiential','£1,200 / wk','£1,800 / wk','£7,000 / wk','Staffing & build additional'],\n      ['Station domination','£15,000','£35,000','£75,000+','8–12 weeks lead time'],\n      ['Traincards (interior)','£18 / panel','£18 / panel','£18 / panel','Sold in fleet packages'],\n      ['Train exterior wrap','POA','POA','from £25,000','Production significant, 12+ weeks'],\n    ];\n\n    const budgets = [\n      { r:'Under £5,000', h:'Single-station local presence', d:'A handful of 6-sheets at a regional or local station, or a short D6 rotation. Genuinely useful for local businesses — the station your customers commute through, every day, for two to four weeks. One of the most underpriced local formats in UK outdoor.' },\n      { r:'£5k – £20k', h:'Meaningful station presence', d:'Multiple formats at a major regional station, a strong panel package at a London terminus, or a traincard campaign across part of a fleet. A £12–15k mix of concourse D6s and platform 6-sheets at Leeds or Manchester Piccadilly builds serious frequency over a month.' },\n      { r:'£20k – £60k', h:'Multi-station or premium terminus', d:'Coordinated campaigns across a commuter corridor, premium large-format digital at a London terminus, or a full-fleet traincard campaign. At this level you can own the journey — home station, inside the train, and the terminus.' },\n      { r:'£60k+', h:'Domination territory', d:'Station takeovers at major termini, multi-city campaigns, or train livery partnerships. Rail becomes a headline channel, and takeovers at the big London stations reliably earn press and social coverage on top of the paid audience.' },\n    ];\n\n    const factors = [\n      { h:'Station footfall tier', d:'The dominant variable. A 6-sheet at Liverpool Street costs ~4× the same panel at a mid-sized regional station — but cost per thousand often favours the regionals, because pricing falls faster than footfall does.' },\n      { h:'Position within the station', d:'Concourse positions facing departure boards command the highest premiums. Platform panels deliver long dwell at lower cost. Entrance and walkway sites deliver volume but shorter exposure.' },\n      { h:'Seasonality & demand', d:'Sept–Nov and Jan–Mar are peak, driven by recruitment, financial services and new-year consumer campaigns. Summer softens commuter volumes but lifts leisure traffic. Flexible timing improves what your budget buys.' },\n      { h:'Campaign duration', d:'Two weeks is standard. Because rail\\u2019s strength is frequency against a repeating audience, longer campaigns disproportionately outperform short ones. If the budget allows four weeks instead of two, take the four.' },\n      { h:'Production', d:'Digital carries no production cost. Printed 6-sheets and 48-sheets add print and posting; traincard printing is low per panel but adds up across a fleet. Build production into the total budget from the start.' },\n    ];\n\n    const stations = [\n      ['Liverpool Street', 80.4, 'City / financial professionals', 'Financial & professional services, B2B'],\n      ['Paddington', 66.9, 'Thames Valley business, Heathrow', 'Tech, business services, premium consumer'],\n      ['London Bridge', 58.5, 'City workers, south-east commuters', 'Professional services, consumer brands'],\n      ['Waterloo', 57.8, 'SW London & Surrey commuters', 'Broad ABC1 consumer, financial services'],\n      ['Victoria', 47.6, 'South London, Gatwick traffic', 'Consumer brands, travel, retail'],\n      [\"King's Cross / St Pancras\", 33.2, 'Intercity & international', 'Premium brands, B2B, travel'],\n      ['Birmingham New Street', 29.1, 'Midlands commuters & intercity', 'Midlands regional campaigns'],\n      ['Leeds', 21.4, 'Yorkshire commuters & business', 'Yorkshire reach, professional services'],\n      ['Glasgow Central', 21.3, 'Scottish commuters & intercity', 'Scottish market campaigns'],\n      ['Manchester Piccadilly', 20.9, 'Northern business & commuters', 'North of England reach, B2B & consumer'],\n    ];\n    const maxUsage = 80.4;\n    const stationRows = stations.map(([name,usage,aud,best]) => ({\n      name, usage: usage.toFixed(1) + 'm', aud, best,\n      pct: (usage / maxUsage * 100).toFixed(1) + '%',\n    }));\n\n    const faqs = [\n      { q:'How much does rail advertising cost in the UK?', a:'Station 6-sheets start from £300 per panel per two weeks regionally, rising to £1,200 at the London termini. A realistic first SME campaign at a major regional station — several panels plus a digital rotation — is typically £4,000–£10,000 for two to four weeks. Premium large-format digital at a London terminus starts from around £9,000 per two weeks.' },\n      { q:'Is rail cheaper than London Underground advertising?', a:'At the entry level, yes — regional station 6-sheets start well below Underground equivalents. At the top end, premium London termini price comparably with premium Underground inventory. The two also serve different audiences: national rail reaches commuter-belt and intercity audiences the Underground does not.' },\n      { q:'Which UK stations are best for advertising?', a:'For national and London-focused campaigns: Liverpool Street, Paddington, Waterloo and London Bridge. For regional: Leeds, Manchester Piccadilly, Birmingham New Street, Glasgow Central and Edinburgh Waverley each dominate their city. For local businesses, the best station is almost always the one at the centre of your own catchment.' },\n      { q:'How long should a campaign run?', a:'Four weeks is the sensible minimum, because frequency against the repeating commuter audience is what makes the format work. Two-week campaigns are useful for time-limited messages, but recall data consistently favours longer runs — which also reduce the per-period cost.' },\n      { q:'Can I advertise at just one local station?', a:'Yes, and for local businesses it is often the smartest buy. Single-station campaigns at local and regional stations start from a few hundred pounds per panel per fortnight and reach everyone in the catchment who commutes, twice a day, every working day.' },\n      { q:'How do I measure whether it worked?', a:'Brand tracking before and after is most reliable for awareness. Branded search volume in Google Search Console during the campaign is the most accessible proxy. Traincards with QR codes generate directly measurable response, and for local campaigns, simply asking new customers how they heard of you remains underrated.' },\n    ];\n\n    const related = [\n      { tag:'Buyer\\u2019s Guide', title:'London Underground Advertising: The Complete 2026 Cost Guide', read:'18 min' },\n      { tag:'Buyer\\u2019s Guide', title:'Billboard Advertising Costs in the UK, Format by Format', read:'15 min' },\n      { tag:'Playbook', title:'How to Plan an OOH Campaign That Actually Builds Frequency', read:'12 min' },\n    ];\n\n    const faqList = faqs.map((f, i) => ({ ...f, open: this.state.openFaq === i, sign: this.state.openFaq === i ? '\\u2212' : '+', onClick: this.toggleFaq(i) }));\n    const formatsOut = formats.map(f => ({ ...f, prices: f.prices.map(([k,v]) => ({ k, v, hasK: !!k })) }));\n    const rateRows = rateCard.map(r => ({ fmt: r[0], reg: r[1], maj: r[2], lon: r[3], note: r[4] }));\n\n    return {\n      progressPct: this.state.progress + '%',\n      bodyGridStyle: 'max-width:1240px;margin:0 auto;padding:52px 24px 0;display:grid;gap:56px;align-items:start;'\n        + (this.state.narrow ? 'grid-template-columns:1fr;' : 'grid-template-columns:250px 1fr;'),\n      tocStyle: this.state.narrow ? 'display:none;' : 'position:sticky;top:96px;align-self:start;',\n      navStyle: 'display:flex;align-items:center;gap:' + (this.state.narrow ? '16px' : '28px') + ';',\n      navLinkStyle: this.state.narrow ? 'display:none;' : 'color:#cdd6e6;font-weight:600;font-size:14.5px;',\n      navInsightStyle: this.state.narrow ? 'display:none;' : 'color:#fff;font-weight:700;font-size:14.5px;border-bottom:2px solid #FF4A00;padding-bottom:4px;',\n      scrollTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }),\n      topBtnStyle: 'position:fixed;right:22px;bottom:22px;z-index:55;width:48px;height:48px;border:none;cursor:pointer;'\n        + 'background:#FF4A00;color:#fff;font-size:22px;font-family:Inter;box-shadow:0 6px 20px rgba(14,30,60,0.28);'\n        + 'transition:opacity .2s,transform .2s;'\n        + (this.state.showTop ? 'opacity:1;transform:translateY(0);pointer-events:auto;' : 'opacity:0;transform:translateY(12px);pointer-events:none;'),\n      shares: ['in','X','f'],\n      toc, stats, audiences, formats: formatsOut, rateRows, budgets, factors,\n      stationRows, faqs: faqList, related,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
