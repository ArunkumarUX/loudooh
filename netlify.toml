[build]
  publish = "."

# NOTE: css/ and js/ assets are NOT fingerprinted (filenames stay the same
# across deploys), so they must NOT be marked immutable. Netlify's default
# static-asset caching already does the right thing: the CDN caches for a year
# but is invalidated on every deploy, and browsers always revalidate. Setting
# `immutable` here previously caused browsers to keep serving stale stylesheets
# for up to a year, which broke newer page styles (e.g. the case-study spine).
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Preferred insight slugs (301 from legacy paths)
[[redirects]]
  from = "/insights/airport"
  to = "/insights/airport-advertising-costs-uk/"
  status = 301
  force = true

[[redirects]]
  from = "/insights/airport/"
  to = "/insights/airport-advertising-costs-uk/"
  status = 301
  force = true

[[redirects]]
  from = "/insights/airport/*"
  to = "/insights/airport-advertising-costs-uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/insights/billboard-advertising-costs-uk"
  to = "/insights/billboard-advertisingguide/"
  status = 301

[[redirects]]
  from = "/insights/billboard-advertising-costs-uk/"
  to = "/insights/billboard-advertisingguide/"
  status = 301

[[redirects]]
  from = "/insights/leeds-billboard-cost-transparency-campaign"
  to = "/insights/leeds-billboard-costtransparency-campaign/"
  status = 301

[[redirects]]
  from = "/insights/leeds-billboard-cost-transparency-campaign/"
  to = "/insights/leeds-billboard-costtransparency-campaign/"
  status = 301

# Legacy pricing path alias used in footer copy
[[redirects]]
  from = "/pricing"
  to = "/insights/pricing/"
  status = 301

[[redirects]]
  from = "/pricing/"
  to = "/insights/pricing/"
  status = 301

[[redirects]]
  from = "/pricing/*"
  to = "/insights/pricing/:splat"
  status = 301
